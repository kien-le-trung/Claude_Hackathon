services:
  postgres:
    image: postgres:16-alpine
    container_name: squatspot-postgres
    environment:
      POSTGRES_DB: squatspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d squatspot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
